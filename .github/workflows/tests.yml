name: Tests

on:
  push:
    branches: [ main, dev, develop, test ]
  pull_request:
    branches: [ main, dev, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install ruff
      run: pip install "ruff==0.15.21"
    - name: Ruff check
      run: ruff check pymaftools/
    - name: Ruff format check
      run: ruff format --check pymaftools/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - python-version: "3.13"
            experimental: true
          - python-version: "3.14"
            experimental: true

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0   # full history + tags for setuptools-scm versioning

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libhdf5-dev pkg-config
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[test]
    
    - name: Run tests
      run: |
        python -c "import sys; print('Python version:', sys.version)"
        python -c "import pandas as pd; print('Pandas version:', pd.__version__)"
        python -c "import networkx as nx; print('NetworkX version:', nx.__version__)"
        ls -la tests/ || echo "Tests directory not found"
        python -m pytest tests/ -v --tb=short --cov=pymaftools --cov-report=term-missing --cov-fail-under=60
      continue-on-error: ${{ matrix.experimental == true }}

  # Dependency-bound matrix: the floors declared in pyproject.toml must really
  # work (lowest-direct resolution), and so must the newest releases inside the
  # caps. A floor that no longer works is caught here rather than by a user.
  dependency-bounds:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            python-version: "3.10"
            resolution: lowest-direct
          - name: latest
            python-version: "3.13"
            resolution: highest
    name: deps-${{ matrix.name }} (py${{ matrix.python-version }})
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libhdf5-dev pkg-config
    - name: Install uv
      run: python -m pip install --upgrade pip uv
    - name: Install with ${{ matrix.resolution }} resolution
      run: uv pip install --system --resolution ${{ matrix.resolution }} -e ".[test]"
    - name: Show resolved versions
      run: python -m pip list | grep -iE "^(pandas|numpy|matplotlib|scipy|scikit-learn|seaborn|statsmodels|networkx|tables|statannotations) "
    - name: Run tests
      run: python -m pytest tests/ -v --tb=short

  package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: "3.11"
    - name: Install build tools
      run: pip install "build>=1.2,<2.0" "twine>=6.0,<7.0" "setuptools-scm>=8,<11"
    - name: Build and check distributions
      run: |
        python -m build
        twine check dist/*
